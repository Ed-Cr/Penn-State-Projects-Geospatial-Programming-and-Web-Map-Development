 <!DOCTYPE html>
 <!--- PURPOSE: This project uses ESRI's SDK for JavaScript to create a profile of the energy resources in Virginia, visualzing both energy potential and infrastructure-->
 <!--- CONSIDERATIONS: This is a practice project. The resulting webmap created may have private layers that are not visible to users outside of the owners account. This is by design. -->
 <!--- BACKGROUND: This project was created as the final project for GEOG 863: Web App Development for Geospatial Professionals from Penn State. -->
 <!--- ACKNOWLEDGEMENTS: This project uses data from the US Energy Information Administration and ESRI's Living Atlas. All data is publically available -->
 <!--- Created by: Edward Cronin, October 2024 -->
 <html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Energy Resources Profile for Virginia: GEOG863 Week 8</title>

    <link rel="stylesheet" href="https://js.arcgis.com/4.30/esri/themes/light/main.css"></link>
    <link rel="stylesheet" href="Profile_Stylesheet.css"></link>
    <script src="https://js.arcgis.com/4.30/"></script>
    <script src="Project_JavaScript.js"></script>
	<script type="module" src=https://js.arcgis.com/calcite-components/2.7.0/calcite.esm.js></script>
	<link rel = "stylesheet" type="text/css" href="https://js.arcgis.com/calcite-components/2.7.0/calcite.css"/>
	
	
  </head>

  <body>
  <calcite-loader></calcite-loader>
      <calcite-shell content-behind>
      <h2 id="header-title" slot="header">
        Energy Resources in Virginia
      </h2>

      <calcite-tabs bordered="true">
        <calcite-tab-nav slot="title-group">
          <calcite-tab-title selected>
		  Energy Infrastructure
		  </calcite-tab-title>
          <calcite-tab-title>Energy Profile</calcite-tab-title>
        </calcite-tab-nav>

        <calcite-tab selected>
          <div id="viewDiv"></div>
        </calcite-tab>

        <calcite-tab>
          <div class="iframe-container" id="capacityDiv">
            <iframe
              id="eia_widget"
			  style="width:100%; height:100%"
              src="https://www.eia.gov/beta/states/iframe/infographic?state=VA">
            </iframe>
          </div>
		  
        </calcite-tab>
      </calcite-tabs>
    </calcite-shell>

	</body>
</html>
